name: Build Guardian for Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore Guardian.sln

      - name: Build solution
        run: dotnet build Guardian.sln --configuration Release --no-restore

      - name: Run core tests
        run: dotnet test tests/Guardian.Core.Tests/Guardian.Core.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Publish self-contained Windows app
        run: dotnet publish src/Guardian.App/Guardian.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/Guardian

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Guardian-Windows-x64
          path: artifacts/Guardian/Guardian.exe
          if-no-files-found: error
